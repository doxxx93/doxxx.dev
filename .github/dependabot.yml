version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      # Lockstep families. These carry no update-types filter on purpose: they
      # have to move together across majors too, or the build fails outright
      # ("react" and "react-dom" must be the exact same version).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "docusaurus-plugin-*"
      # Everything else: minor/patch batched, each major on its own PR.
      rest:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 removed the `baseUrl` option, and @docusaurus/tsconfig --
      # the base config we extend -- still sets it. Nothing we can fix on our
      # side. Drop this once docusaurus ships a TS7-compatible tsconfig.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
