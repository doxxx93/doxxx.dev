version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      # the @docusaurus/* packages are released in lockstep and must move together
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "docusaurus-plugin-*"
      rest:
        patterns: ["*"]
