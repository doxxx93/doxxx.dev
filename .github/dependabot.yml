version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Groups here cover minor/patch only, so every major lands as its own
  # reviewable PR instead of riding along in a batch.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      # the @docusaurus/* packages are released in lockstep and must move together
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "docusaurus-plugin-*"
        update-types: ["minor", "patch"]
      rest:
        patterns: ["*"]
        update-types: ["minor", "patch"]
