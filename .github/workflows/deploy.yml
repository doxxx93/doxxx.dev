name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  # Validates PRs (including dependabot's) with the build job only.
  pull_request:
    branches:
      - master

# Deploys on master share one queue and are never cancelled mid-flight.
# PR builds are per-ref and a new push supersedes the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The build job must stay secret-free: dependabot runs get a read-only token
# and cannot see Actions secrets.
permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 is required — docusaurus reads git history for showLastUpdateTime
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # docusaurus and the prebuild script run on node; bun is only the package manager
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build website
        run: bun run build
      - name: Upload Build Artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  reindex:
    name: Trigger Algolia Crawler
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for content changes
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # github.event.before is the zero SHA on a branch's first push or after a force-push
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE=$(git rev-parse HEAD~1 2>/dev/null || true)
          fi
          if [ -n "$BEFORE" ] && git diff --name-only "$BEFORE" HEAD | grep -qE '^(blog|docs|i18n)/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Algolia Reindex
        if: steps.check.outputs.changed == 'true'
        env:
          CRAWLER_ID: ${{ secrets.ALGOLIA_CRAWLER_ID }}
          CRAWLER_USER_ID: ${{ secrets.ALGOLIA_CRAWLER_USER_ID }}
          CRAWLER_API_KEY: ${{ secrets.ALGOLIA_CRAWLER_API_KEY }}
        run: |
          curl -X POST "https://crawler.algolia.com/api/1/crawlers/$CRAWLER_ID/reindex" \
            -H "Content-Type: application/json" \
            -u "$CRAWLER_USER_ID:$CRAWLER_API_KEY"
